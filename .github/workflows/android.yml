name: Android

# FilmCraft for Android (apps/filmcraft-android): a release APK per ABI on every push and pull
# request, a smoke test on an x86_64 emulator (install, launch, screenshot, no crash in logcat),
# and a GitHub release with the APKs for a `v*` tag.
on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

jobs:
  apk:
    name: APK (${{ matrix.abi }})
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        abi: [arm64-v8a, x86_64]
        include:
          - abi: arm64-v8a
            target: aarch64-linux-android
          - abi: x86_64
            target: x86_64-linux-android
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Rust
        run: |
          rustup toolchain install stable --profile minimal --target ${{ matrix.target }}
          rustup default stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: android-${{ matrix.abi }}
      - name: Build
        env:
          FILMCRAFT_KEYSTORE_B64: ${{ secrets.FILMCRAFT_KEYSTORE_B64 }}
          FILMCRAFT_KEYSTORE_PASSWORD: ${{ secrets.FILMCRAFT_KEYSTORE_PASSWORD }}
          FILMCRAFT_KEY_ALIAS: ${{ secrets.FILMCRAFT_KEY_ALIAS }}
          FILMCRAFT_KEY_PASSWORD: ${{ secrets.FILMCRAFT_KEY_PASSWORD }}
        run: |
          # a release key from the repository secrets when there is one, else a debug key
          if [ -n "$FILMCRAFT_KEYSTORE_B64" ]; then
            echo "$FILMCRAFT_KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.keystore"
            export FILMCRAFT_KEYSTORE="$RUNNER_TEMP/release.keystore"
          fi
          export ANDROID_NDK_HOME="${ANDROID_NDK_LATEST_HOME:-$ANDROID_NDK_HOME}"
          apps/filmcraft-android/build.sh --abis ${{ matrix.abi }} --out dist
      - uses: actions/upload-artifact@v4
        with:
          name: FilmCraft-apk-${{ matrix.abi }}
          path: dist/*.apk
          if-no-files-found: error

  smoke:
    name: Emulator smoke test
    needs: apk
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: FilmCraft-apk-x86_64
          path: dist
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          force-avd-creation: false
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          disable-animations: true
          script: apps/filmcraft-android/ci-smoke.sh dist smoke
      - name: Screenshot (base64 PNG, for reading from the log)
        if: always()
        run: |
          if [ -f smoke/screenshot.png ]; then
            echo "----- BEGIN SCREENSHOT -----"
            base64 -w 0 smoke/screenshot.png
            echo
            echo "----- END SCREENSHOT -----"
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: FilmCraft-android-smoke
          path: smoke/

  release:
    name: Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [apk, smoke]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: FilmCraft-apk-*
          path: dist
          merge-multiple: true
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/*.apk --repo "$GITHUB_REPOSITORY" --title "FilmCraft for Android $GITHUB_REF_NAME" --generate-notes
