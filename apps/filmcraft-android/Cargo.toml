[package]
name = "filmcraft-android"
description = "FilmCraft on Android: NativeActivity shell (eframe on Vulkan / GLES), MediaCodec decoding, AAudio, shared-storage file browser"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

# The workspace lints, except that `unsafe_code` is `deny` instead of `forbid`: `android_main` must
# be exported unmangled (`#[unsafe(no_mangle)]`), the one item allowed it. No unsafe code runs here;
# JNI lives in crates/platform (AGENTS.md §0.3).
[lints.rust]
unsafe_code = "deny"

[lints.clippy]
dbg_macro = "warn"
todo = "warn"
too_many_arguments = "allow"
needless_range_loop = "allow"
type_complexity = "allow"

# libfilmcraft.so, loaded by FilmcraftActivity (java/) through NativeActivity. Only the touch
# interface (touch bar, edits, gestures) is built on other targets, so `cargo test --workspace` and
# clippy cover it. Build the APK with `apps/filmcraft-android/build.sh` (see README.md there).
[lib]
name = "filmcraft"
crate-type = ["cdylib", "rlib"]

[dependencies]
# the touch bar, its edits and the touch gestures are built and tested on every target
egui = { workspace = true }
eframe = { workspace = true, features = ["default_fonts", "wgpu"] }
filmcraft-engine = { workspace = true }
filmcraft-media = { workspace = true }
filmcraft-project = { workspace = true }
filmcraft-time = { workspace = true }
filmcraft-ui-egui = { workspace = true }
serde_json = { workspace = true }
log = { workspace = true }

[dev-dependencies]
egui_kittest = { workspace = true, features = ["eframe", "wgpu"] }
image = { version = "0.25", default-features = false, features = ["png"] }

[target.'cfg(target_os = "android")'.dependencies]
filmcraft-export = { workspace = true }
filmcraft-render = { workspace = true }
filmcraft-gpu = { workspace = true }
filmcraft-platform = { workspace = true }
# NativeActivity (not GameActivity): winit turns key events into text, and the activity's input
# view (java/) delivers the soft keyboard's text; AccessKit's adapter needs GameActivity, so it is off.
eframe = { workspace = true, features = ["default_fonts", "wgpu", "android-native-activity"] }
# The same winit as eframe, for `AndroidApp` (android-activity's handle on the activity).
winit = { version = "0.30", default-features = false, features = ["android-native-activity"] }
chrono = { workspace = true, features = ["clock"] }
# AAudio output and input through the same cpal code as the desktop app (audio.rs, audio_in.rs).
cpal = "0.16"
# logcat (MIT OR Apache-2.0).
android_logger = { version = "0.15", default-features = false }
